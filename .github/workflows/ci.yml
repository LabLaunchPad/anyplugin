name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: OKF bundle conformance
        run: node cli/dist/bin.js okf-validate knowledge
      - name: E2E build smoke (all four agents)
        run: node cli/dist/bin.js build --plugin plugins/knowledge/plugin --out .anyplugin-build --runner plugins/knowledge/runtime/runner.js --mcp-runtime plugins/knowledge/runtime

name: Release

# The first release of @lablaunchpad/*.
#
# ── What this workflow does ────────────────────────────────────────────────
#
# It publishes the seven packages in DEPENDENCY ORDER — core, the four
# adapters, the kernel, then the CLI — because a package published before
# its dependencies ships a package whose dependencies 404 on install.
#
# The publishing is done by `scripts/release.mjs`, which refuses to publish
# anything that is not ready: a version that already exists, a version with
# no changelog entry, a tarball that leaks source or compiled tests, or a
# published manifest that still carries a `workspace:` spec.
#
# ── Provenance ──────────────────────────────────────────────────────────────
#
# npm's provenance is the attestation that says which workflow published
# which bytes. It requires an OIDC token — `id-token: write` below — and
# NO long-lived secret, when the npm account has TRUSTED PUBLISHING
# configured for this repository.
#
# That configuration is on the npm side and is a one-time human action:
#
#   npmjs.com → your account → Settings → Trusted Publisher
#     → package: @lablaunchpad/core   (and each of the other six)
#     → organization or user: LabLaunchPad
#     → repository: anyplugin
#     → workflow filename: release.yml
#
# WHAT THE FAILURE ACTUALLY LOOKS LIKE. npm 11 catches the token-exchange
# failure and reports it as `ENEEDAUTH` — "This command requires you to be
# logged in" — NOT as an error that names the package. The real cause is
# only visible at `--verbose`. So the failure to look for is:
#
#   npm error code ENEEDAUTH
#
# and the answer is: trusted publishing is not configured for THAT package
# yet. Configure it and re-run; the release is RESUMABLE, so the packages
# that already landed are skipped and only the missing ones are published.
#
# An `NPM_TOKEN` secret is the fallback for a package that is not
# configured for trusted publishing. The empty string is deliberately NOT
# passed when the secret is absent: npm treats an empty bearer token as an
# invalid credential and reports E401, which looks like a bad token rather
# than like a missing configuration.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # npm provenance: the attestation that says which workflow published
      # which bytes. This is the whole reason the release runs in CI rather
      # than on a laptop.
      id-token: write
      contents: read
    env:
      # Whether an npm token exists. Secrets cannot be used directly in an
      # `if:` condition, so the answer is exported once and the steps read
      # it. An absent secret evaluates to the empty string, which is not
      # "true", which is exactly the answer we want.
      NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # npm's provenance attests to the COMMIT, so it must be the
          # published commit, not a merge.
          fetch-depth: 0

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: The full suite
        run: pnpm test

      - name: OKF bundle conformance
        run: node cli/dist/bin.js okf-validate knowledge

      - name: Check the release
        # The check runs BEFORE the publish, and it is the same check the
        # publishing guard runs in the test suite. If it fails here, nothing
        # is published.
        run: node scripts/release.mjs --check

      - name: Publish (with an npm token)
        # Only runs when a token exists. The presence of the secret is
        # exported as a job variable because secrets cannot be referenced
        # directly in an `if:` condition.
        #
        # The token is NOT set when it is absent: an empty bearer token is
        # an invalid credential, npm reports it as E401, and it makes npm
        # prefer the token over the attestation exchange — so an empty
        # variable would BREAK trusted publishing rather than fall back
        # from it.
        if: env.NPM_TOKEN_PRESENT == 'true'
        run: node scripts/release.mjs --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (with npm's trusted publishing)
        # No token at all: npm exchanges the runner's OIDC identity for a
        # short-lived credential, and the registry records which workflow
        # published which bytes. This is the path the first release should
        # take, because the attestation is the point of publishing from CI
        # rather than from a laptop.
        if: env.NPM_TOKEN_PRESENT != 'true'
        run: node scripts/release.mjs --publish
